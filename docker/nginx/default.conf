server {
    listen 80;
    server_name _;

    auth_basic           "Mini PACS";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # DICOM uploads can be large.
    client_max_body_size 0;
    proxy_request_buffering off;

    # Unauthenticated health endpoint for load balancers / smoke tests.
    location = /healthz {
        auth_basic off;
        return 200 "ok\n";
    }

    # Orthanc REST API, DICOMweb (/orthanc/dicom-web) and Orthanc Explorer 2 (/orthanc/ui/).
    location /orthanc/ {
        proxy_pass         http://orthanc:8042/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Orthanc never sees the basic-auth header; it trusts the proxy.
        proxy_set_header   Authorization "";
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    # OHIF viewer (SPA).
    location / {
        proxy_pass       http://ohif:80;
        proxy_set_header Host $host;
    }
}
